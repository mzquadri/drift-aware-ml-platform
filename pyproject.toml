[project]
name = "drift-aware-ml-platform"
version = "0.1.0"
description = "A demand-forecasting platform that detects when its own model has gone stale and retrains itself"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mohd Zamin Quadri", email = "mohdzaminquadri@gmail.com" }]

dependencies = [
    "pandas>=2.2",
    "pyarrow>=16.0",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "prometheus-client>=0.20",
    # MLflow 3 for registry aliases and the log_model(name=...) form. Stages,
    # which 2.x used, are deprecated and the alias is the supported route.
    "mlflow>=3.0",
    # Evidently 0.7 reshaped the API: Report/Dataset/DataDefinition, and drift
    # scores became distances rather than p-values. 0.4.x also fails to build on
    # Python 3.13, so pinning back is not an option.
    "evidently>=0.7,<0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
mlplatform = "mlplatform.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["network: needs the UCI download, skipped by default in CI"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src/mlplatform"]
