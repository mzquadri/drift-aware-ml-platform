[project]
name = "drift-aware-ml-platform"
version = "0.1.0"
description = "A demand-forecasting platform that detects when its own model has gone stale and retrains itself"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mohd Zamin Quadri", email = "mohdzaminquadri@gmail.com" }]

dependencies = [
    "pandas>=2.2",
    "pyarrow>=16.0",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "prometheus-client>=0.20",
    # MLflow 3 for registry aliases and the log_model(name=...) form. Stages,
    # which 2.x used, are deprecated and the alias is the supported route.
    # Pinned rather than floating because the tracking server in
    # docker-compose.yml is the same version, and a client newer than the server
    # fails on exactly the MLflow 3 calls registry.py makes.
    "mlflow==3.16.1",
    # Evidently 0.7 reshaped the API: Report/Dataset/DataDefinition, and drift
    # scores became distances rather than p-values. 0.4.x also fails to build on
    # Python 3.13, so pinning back is not an option.
    "evidently>=0.7,<0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.6"]
# Only scripts/experiments needs these. The service and the test suite do not,
# so a deployment does not carry a streaming-detector library it never calls.
experiments = ["river>=0.21"]
# Airflow is what runs the DAGs in airflow/dags, and it was previously declared
# nowhere: not here, not in a requirements file, and no CI job imported a DAG.
# That is why two path defects in airflow/dags/demand_platform.py and
# docker-compose.yml went unnoticed. Its own group because neither the service
# nor the test suite imports it, and it is a large install.
#
# Pinned to the minor the compose image runs (apache/airflow:2.10.2-python3.11)
# so a DAG that imports here is a DAG that imports there.
#
# This extra needs Python < 3.13; 2.10.2 declares Requires-Python >=3.8,<3.13.
# The rest of the project runs on 3.13, so the ceiling is deliberately not put
# on `requires-python`. Installing this extra on 3.13 fails with pip saying so,
# which is wanted: an environment marker would quietly resolve to nothing and
# leave a DAG-less install looking successful.
#
# Installing it in one command with Airflow's constraints file does not work:
# those pin pandas==2.1.4 and this project needs pandas>=2.2. Install Airflow
# under its constraints first and the project after, as docker/Dockerfile.airflow
# and the `dags` CI job both do. Core Airflow does not depend on pandas, so the
# upgrade is safe; the bound is on its optional `pandas` extra.
airflow = ["apache-airflow==2.10.2"]

[project.scripts]
mlplatform = "mlplatform.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["network: needs the UCI download, skipped by default in CI"]
# Warnings raised from this project's own modules are errors; warnings from
# dependencies are not. Without this a deprecation in src/ passes silently,
# which is how pandas' Timestamp.utcnow removal notice survived here unseen.
# The module field is matched against the module the warning is attributed to,
# so a third-party DeprecationWarning triggered inside mlplatform still fails,
# which is the case worth catching.
filterwarnings = [
    "default",
    "error::DeprecationWarning:mlplatform.*",
    "error::FutureWarning:mlplatform.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src/mlplatform"]
