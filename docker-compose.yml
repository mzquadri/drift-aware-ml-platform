# The whole platform on one machine. Nothing here needs a cloud account, which
# is the point: the cloud path in infra/terraform is a deployment target, not a
# prerequisite for running or reviewing the project.

name: drift-aware-ml-platform

x-common-env: &common-env
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MODEL_NAME: bike-demand
  MODEL_STAGE: Production
  # The `artifacts` volume is one volume mounted in two places: /app/artifacts in
  # the service, /opt/airflow/artifacts in Airflow. These defaults are the
  # service's side; the airflow service overrides both to its own mount point so
  # the two containers read and write the same files.
  ARTIFACTS_DIR: /app/artifacts
  PREDICTION_LOG: /app/artifacts/predictions.parquet

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the second database Airflow needs. POSTGRES_DB makes only one,
      # and the airflow service below asks for postgres/airflow, which did not
      # exist until this ran.
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-airflow-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    # Pinned to the same version as the client in pyproject.toml. The two have to
    # match: registry.py calls log_model(name=...) and passes skops_trusted_types,
    # both of which are MLflow 3 forms a 2.x server has no route for. This image
    # was v2.16.2 while the client asked for >=3.0, which is a pairing that cannot
    # work and only stayed unnoticed because nothing had run against the server.
    image: ghcr.io/mlflow/mlflow:v3.16.1
    # psycopg2 is not in the official image, so the postgres backend store cannot
    # be opened without installing the driver first.
    command: >
      bash -c "pip install --quiet psycopg2-binary &&
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://platform:platform@postgres/platform
      --artifacts-destination /mlruns
      --serve-artifacts"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - mlflow-artifacts:/mlruns
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  service:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      <<: *common-env
    depends_on:
      mlflow:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - artifacts:/app/artifacts

  # Airflow in standalone mode: one container, scheduler and webserver together.
  # Fine for a single-machine demo, and honest about being that rather than
  # pretending to be a production deployment.
  airflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    command: airflow standalone
    environment:
      <<: *common-env
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://platform:platform@postgres/airflow
      SERVICE_URL: http://service:8000
      # Both overridden off the shared block, which spells the service's own
      # /app paths. This container has no /app: the project is at
      # /opt/airflow/project and the artefact volume at /opt/airflow/artifacts.
      # Left as inherited, `mlplatform monitor --source predictions` read a
      # prediction log under a directory that does not exist here, and the
      # branch task read its decision file from somewhere the CLI never wrote.
      ARTIFACTS_DIR: /opt/airflow/artifacts
      PREDICTION_LOG: /opt/airflow/artifacts/predictions.parquet
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/airflow/project
      - artifacts:/opt/airflow/artifacts

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - service

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres-data:
  mlflow-artifacts:
  prometheus-data:
  grafana-data:
  artifacts:
